steps:
# Run Terraform to destroy the function and its resources
- name: 'hashicorp/terraform:1.0.0'
  id: terraform-destroy
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd terraform
    terraform init -backend-config="prefix=cloud-spanner-demo/${_PROJECT_SUFFIX}/consolidator"
    terraform destroy -auto-approve \
      -var="project_id=${_PROJECT_ID}" \
      -var="region=${_REGION}" \
      -var="location=${_LOCATION}" \
      -var="repository_id=${_REPOSITORY_ID}" \
      -var="image_name=${_IMAGE_NAME}" \
      -var="image_tag=$BUILD_ID" \
      -var="topic_name=${_TOPIC_NAME}" \
      -var="consolidator_sa_email=${_CONSOLIDATOR_SA_EMAIL}" \
      -var="spanner_instance_id=${_SPANNER_INSTANCE_ID}" \
      -var="spanner_database_id=${_SPANNER_DATABASE_ID}" \
      -var="redis_host=${_REDIS_HOST}" \
      -var="redis_port=${_REDIS_PORT}" \
      -var="redis_password=${_REDIS_PASSWORD}"

options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOCATION: 'europe-west1'
  _REPOSITORY_ID: 'my-docker-repo'
  _IMAGE_NAME: 'consolidator'
  _REGION: 'europe-west1'
  _TOPIC_NAME: 'consolidator-trigger-topic'
  _CONSOLIDATOR_SA_EMAIL: 'consolidator-sa@${_PROJECT_ID}.iam.gserviceaccount.com'
  _PROJECT_SUFFIX: '' # This will be overridden by the trigger
  _SPANNER_INSTANCE_ID: '' # This will be overridden by the trigger
  _SPANNER_DATABASE_ID: '' # This will be overridden by the trigger
  _REDIS_HOST: '' # This will be overridden by the trigger
  _REDIS_PORT: '' # This will be overridden by the trigger
  _REDIS_PASSWORD: '' # This will be overridden by the trigger