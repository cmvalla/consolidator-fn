steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_ID}/consolidator-fn:${_TAG}',
    '.'
  ]
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_ID}/consolidator-fn:${_TAG}']
- name: 'hashicorp/terraform:1.0.0'
  id: terraform-init
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd terraform
    terraform init -backend-config="prefix=cloud-spanner-demo/consolidator/${_PROJECT_SUFFIX}"
  waitFor: ['push']
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'functions'
  - 'deploy'
  - 'consolidator-fn'
  - '--gen2'
  - '--region'
  - '${_LOCATION}'
  - '--image'
  - '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_ID}/consolidator-fn:${_TAG}'
  - '--trigger-http'
  - '--no-allow-unauthenticated'
  - '--set-env-vars'
  - 'PROJECT_ID=${_PROJECT_ID},LOCATION=${_LOCATION},REDIS_HOST=${_REDIS_HOST},REDIS_PORT=${_REDIS_PORT},SPANNER_INSTANCE=${_SPANNER_INSTANCE},SPANNER_DATABASE=${_SPANNER_DATABASE}'
images:
- '${_LOCATION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY_ID}/consolidator-fn:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _LOCATION: 'europe-west1'
  _PROJECT_ID: '${PROJECT_ID}'
  _REPOSITORY_ID: 'my-docker-repo'
  _TAG: 'latest'
  _REDIS_HOST: '127.0.0.1' # Placeholder, will be overridden by Terraform
  _REDIS_PORT: '6379' # Placeholder, will be overridden by Terraform
  _SPANNER_INSTANCE: 'my-spanner-instance' # Placeholder, will be overridden by Terraform
  _SPANNER_DATABASE: 'my-spanner-database' # Placeholder, will be overridden by Terraform
  _PROJECT_SUFFIX: '' # This will be overridden by the trigger